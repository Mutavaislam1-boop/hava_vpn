<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HAVA Admin</title><link rel="stylesheet" href="/static/style.css"><style>main{max-width:900px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px;color:var(--sky);margin-top:9px}table{width:100%;border-collapse:collapse;margin-top:24px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}input{background:#071522;border:1px solid var(--line);color:#fff;padding:13px;border-radius:10px;width:100%}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main><header><div class="brand"><span class="logo">H</span><div><b>HAVA ADMIN</b><small>центр управления</small></div></div></header><section class="screen active"><div class="eyebrow">ОБЗОР</div><h1>Пульс HAVA</h1><div id="login" class="glass"><p>Введите ADMIN_TOKEN из .env</p><input id="token" type="password" placeholder="Admin token"><button class="primary" onclick="load()">Войти</button></div><div id="dashboard" hidden><div class="stats"><div class="glass stat">Пользователи<b id="users">0</b></div><div class="glass stat">Активные VPN<b id="active">0</b></div><div class="glass stat">Stars всего<b id="stars">0</b></div><div class="glass stat">В очереди<b id="pending">0</b></div></div><h2>Последние пользователи</h2><div class="glass"><table><thead><tr><th>HAVA ID</th><th>Telegram</th><th>Дата</th></tr></thead><tbody id="userRows"></tbody></table></div></div></section></main><script>async function load(){const token=document.querySelector('#token').value;localStorage.adminToken=token;const h={'X-Admin-Token':token};try{const[d,u]=await Promise.all([fetch('/api/admin/dashboard',{headers:h}).then(x=>{if(!x.ok)throw 0;return x.json()}),fetch('/api/admin/users',{headers:h}).then(x=>x.json())]);login.hidden=true;dashboard.hidden=false;users.textContent=d.users;active.textContent=d.active_vpn;stars.textContent=d.stars_total;pending.textContent=d.provisioning_pending;userRows.innerHTML=u.map(x=>`<tr><td>#${x.id}</td><td>${x.username?'@'+x.username:x.telegram_id}</td><td>${new Date(x.created_at).toLocaleDateString('ru')}</td></tr>`).join('')}catch(e){alert('Неверный токен')}}token.value=localStorage.adminToken||'';</script></body></html>
