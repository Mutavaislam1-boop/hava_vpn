services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hava:hava@db:5432/hava
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hava
      POSTGRES_USER: hava
      POSTGRES_PASSWORD: hava
    volumes: ["hava_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hava"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hava_db:

